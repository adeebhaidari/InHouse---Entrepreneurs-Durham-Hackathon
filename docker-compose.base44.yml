services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
